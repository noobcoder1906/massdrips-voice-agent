name: Deploy to E2E GPU Node

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: root
          password: ${{ secrets.EC2_PASSWORD }}
          script: |
            # Clone or pull latest code
            if [ ! -d "massdrips-voice-agent" ]; then
              git clone https://github.com/noobcoder1906/massdrips-voice-agent.git
            fi
            cd massdrips-voice-agent
            git pull origin main
            
            # Setup environment variables (injecting Twilio too)
            echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" > .env
            echo "MONGO_URI=${{ secrets.MONGODB_URI }}" >> .env
            echo "TELEPHONY_PROVIDER=twilio" >> .env
            echo "TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}" >> .env
            echo "TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}" >> .env
            echo "TWILIO_PHONE_NUMBER=${{ secrets.TWILIO_PHONE_NUMBER }}" >> .env
            echo "TTS_PROVIDER=chatterbox_clone" >> .env
            
            # Ensure docker and nvidia drivers are ready
            docker compose up --build -d
