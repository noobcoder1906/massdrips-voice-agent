version: '3.8'

services:
  voxsales:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - SERVER_HOST=164.52.212.94:8000
    volumes:
      - ./models:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
