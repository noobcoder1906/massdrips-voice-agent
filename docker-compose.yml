version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# VoxSales — Docker Compose
#
# For local dev/testing, use: docker-compose up voxsales-api
# For full stack with local LLM: docker-compose up
#
# NOTE: Ollama needs significant RAM (4GB+ for llama3.2:3b).
#       On CPU-only machines, use TELEPHONY_PROVIDER=mock and test via /docs.
#       GPU support: uncomment the 'deploy' block under the ollama service.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Main FastAPI Application ──────────────────────────────────────────────
  voxsales-api:
    build: .
    container_name: voxsales_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - MONGO_URI=${MONGO_URI}
    depends_on:
      - ollama
    restart: unless-stopped
    volumes:
      # Mount Kokoro models so they persist across rebuilds
      - ./kokoro-v1.0.onnx:/app/kokoro-v1.0.onnx
      - ./voices-v1.0.bin:/app/voices-v1.0.bin

  # ── Ollama LLM (local, self-hosted) ──────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: voxsales_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # ── GPU support (uncomment if you have NVIDIA GPU + nvidia-docker) ──
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]

volumes:
  ollama_data:
    driver: local
